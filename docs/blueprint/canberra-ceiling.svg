<text x="60.0" y="1322.0" font-size="11" text-anchor="start" fill="#333" font-weight="400" font-family="system-ui, sans-serif">Slats run across the room (along x) every 0.25 m. Spots every 1.1 m on rails 0.5 m in from the walls.</text>
<text x="60.0" y="1338.0" font-size="11" text-anchor="start" fill="#333" font-weight="400" font-family="system-ui, sans-serif">Ceiling height 3 m; the rails sit at 2.96 m. Panel rows read from the front-on photograph; the exact count is an estimate.</text>
<text x="60.0" y="1354.0" font-size="11" text-anchor="start" fill="#a33" font-weight="400" font-family="system-ui, sans-serif">The hanging mark is an original service mark, not anyone's logo.</text>
