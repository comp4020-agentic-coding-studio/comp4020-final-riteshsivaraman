<text x="60.0" y="668.0" font-size="11" text-anchor="start" fill="#333" font-weight="400" font-family="system-ui, sans-serif">Green: people walking past (two stop to window-shop). Red: customers who come in through the opening, look at tables and leave. Olive: people on the mezzanine.</text>
<text x="60.0" y="684.0" font-size="11" text-anchor="start" fill="#333" font-weight="400" font-family="system-ui, sans-serif">Everyone is placed by the shared server clock, so all visitors see the same people in the same places. The mezzanine and neighbouring shops are not enterable.</text>
<text x="60.0" y="700.0" font-size="11" text-anchor="start" fill="#a33" font-weight="400" font-family="system-ui, sans-serif">Sizes of the concourse, the neighbours and the mezzanine are assumed; only the store itself comes from the reference photographs.</text>
