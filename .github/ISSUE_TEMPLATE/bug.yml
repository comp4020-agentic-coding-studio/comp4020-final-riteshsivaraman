name: Bug
description: Something in the store is wrong (report the symptom, not a diagnosis)
labels: ["type:bug", "status:needs-triage"]
body:
  - type: textarea
    id: symptom
    attributes:
      label: Symptom
      description: What happened, what was expected, exact text if short.
    validations: { required: true }
  - type: textarea
    id: repro
    attributes:
      label: Repro
      description: Roles, viewports, steps. Two profiles if it involves more than one person.
    validations: { required: true }
  - type: input
    id: sensor
    attributes:
      label: Failing check
      description: Filled in by the spec-writer. The sensor comes before the fix (CLAUDE.md "defect loop").
