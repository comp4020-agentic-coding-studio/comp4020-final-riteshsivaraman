<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Lock screen</title>

</head>
<body>


<style>
body{margin:0;background:#000}
body[data-cutout=island] .notch,body[data-cutout=island] .punch,body[data-cutout=notch] .island,body[data-cutout=notch] .punch,body[data-cutout=punch] .island,body[data-cutout=punch] .notch{display:none}

.glass{background:rgba(255,255,255,0.2);-webkit-backdrop-filter:blur(24px) saturate(1.6);backdrop-filter:blur(24px) saturate(1.6);border:1px solid rgba(255,255,255,0.28);box-shadow:inset 0 1px 0 rgba(255,255,255,0.5),inset 0 -1px 0 rgba(255,255,255,0.12),0 10px 28px rgba(10,8,40,0.28)}
</style>

<div style="position: relative; width: 390px; height: 844px; overflow: hidden; box-sizing: border-box; color: #fff; font-family: Arial, 'Liberation Sans', sans-serif; background: radial-gradient(120% 55% at 15% 8%, #ff8a5c 0%, rgba(255,138,92,0) 60%), radial-gradient(90% 60% at 95% 42%, #7a5cff 0%, rgba(122,92,255,0) 65%), radial-gradient(120% 70% at 25% 105%, #ffe29a 0%, rgba(255,226,154,0) 55%), #1c1a4d">

<div class="cut island" style="position: absolute; top: 11px; left: 132px; width: 126px; height: 37px; border-radius: 19px; background: #000"></div>
<div class="cut notch" style="position: absolute; top: 0; left: 87px; width: 216px; height: 32px; border-radius: 0 0 20px 20px; background: #000"></div>
<div class="cut punch" style="position: absolute; top: 14px; left: 182px; width: 26px; height: 26px; border-radius: 13px; background: #000"></div>

<!-- status bar: signal, wifi, battery (time lives on the lock screen itself) -->
<div style="position: absolute; top: 0; left: 0; right: 0; height: 54px; display: flex; align-items: center; justify-content: space-between; padding: 6px 30px 0 34px; box-sizing: border-box">
<span style="font-size: 15px; font-weight: 600; letter-spacing: 0.1px; opacity: 0.0">11:24</span>
<div style="display: flex; align-items: center; gap: 6px">
<svg width="18" height="12" viewBox="0 0 18 12" fill="#fff" aria-hidden="true"><rect x="0" y="8" width="3" height="4" rx="0.8"/><rect x="5" y="5.5" width="3" height="6.5" rx="0.8"/><rect x="10" y="3" width="3" height="9" rx="0.8"/><rect x="15" y="0" width="3" height="12" rx="0.8"/></svg>
<svg width="16" height="12" viewBox="0 0 16 12" fill="none" stroke="#fff" stroke-width="1.8" stroke-linecap="round" aria-hidden="true"><path d="M1.5 4.2a9.5 9.5 0 0 1 13 0"/><path d="M4 7a6 6 0 0 1 8 0"/><circle cx="8" cy="10" r="1" fill="#fff" stroke="none"/></svg>
<svg width="27" height="13" viewBox="0 0 27 13" aria-hidden="true"><rect x="0.5" y="0.5" width="23" height="12" rx="3.8" fill="none" stroke="#fff" stroke-opacity="0.45"/><rect x="2" y="2" width="17" height="9" rx="2.4" fill="#fff"/><rect x="25" y="4.2" width="1.6" height="4.6" rx="0.8" fill="#fff" fill-opacity="0.5"/></svg>
</div>
</div>

<!-- lock indicator -->
<svg style="position: absolute; top: 66px; left: 183px" width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="#fff" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-label="Locked" role="img"><rect x="5" y="10.5" width="14" height="10" rx="2.6" fill="#fff" fill-opacity="0.9" stroke="none"/><path d="M8.5 10.5V8a3.5 3.5 0 0 1 7 0v2.5"/></svg>

<!-- date and time -->
<div style="position: absolute; top: 108px; left: 0; right: 0; text-align: center">
<div style="font-size: 20px; font-weight: 600; line-height: 24px; opacity: 0.92">Sunday 11 October</div>
<div style="font-size: 98px; font-weight: 600; line-height: 104px; letter-spacing: -2px; margin-top: 2px; font-variant-numeric: tabular-nums">11:24</div>
</div>

<!-- two circular widgets -->
<div style="position: absolute; top: 262px; left: 0; right: 0; display: flex; justify-content: center; gap: 12px">
<div class="glass" style="width: 76px; height: 76px; border-radius: 38px; display: flex; align-items: center; justify-content: center; position: relative">
<svg width="76" height="76" viewBox="0 0 76 76" fill="none" aria-hidden="true" style="position: absolute; inset: 0"><circle cx="38" cy="38" r="29" stroke="#fff" stroke-opacity="0.25" stroke-width="6"/><circle cx="38" cy="38" r="29" stroke="#fff" stroke-width="6" stroke-linecap="round" stroke-dasharray="130 182" transform="rotate(-90 38 38)"/></svg>
<span style="font-size: 17px; font-weight: 600; position: relative">72%</span>
</div>
<div class="glass" style="width: 76px; height: 76px; border-radius: 38px; display: flex; flex-direction: column; align-items: center; justify-content: center">
<span style="font-size: 22px; font-weight: 600; line-height: 24px">18°</span>
<span style="font-size: 11px; font-weight: 500; opacity: 0.85; line-height: 14px">Clear</span>
</div>
</div>

<!-- bottom buttons -->
<div class="glass" style="position: absolute; left: 46px; bottom: 76px; width: 50px; height: 50px; border-radius: 25px; display: flex; align-items: center; justify-content: center; background: rgba(0,0,0,0.28)">
<svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="#fff" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-label="Torch" role="img"><path d="M8 3h8l-1.5 6h-5z"/><path d="M9.5 9v11a1 1 0 0 0 1 1h3a1 1 0 0 0 1-1V9"/><path d="M12 12.5v2.5"/></svg>
</div>
<div class="glass" style="position: absolute; right: 46px; bottom: 76px; width: 50px; height: 50px; border-radius: 25px; display: flex; align-items: center; justify-content: center; background: rgba(0,0,0,0.28)">
<svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="#fff" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-label="Camera" role="img"><path d="M3 8.5h4l1.5-2.5h7L17 8.5h4V19H3z"/><circle cx="12" cy="13.5" r="3.6"/></svg>
</div>

<!-- swipe-up hint and home indicator -->
<div style="position: absolute; bottom: 24px; left: 0; right: 0; text-align: center; font-size: 12px; font-weight: 500; opacity: 0.7">Swipe up to unlock</div>
<div style="position: absolute; bottom: 8px; left: 130px; width: 134px; height: 5px; border-radius: 3px; background: rgba(255,255,255,0.92)"></div>

</div>


<script>document.body.dataset.cutout=new URLSearchParams(location.search).get("cutout")||"island"</script>
</body>
</html>
